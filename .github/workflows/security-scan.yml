name: Security Scan

# Audits the dependency trees for known CVEs.
#
# Two triggers, and they do different jobs. The path filter catches a bad
# dependency the moment it is added — that is the cheap half, and on its own it
# would be wrong: advisories are published against lockfiles nobody has
# touched, so filtering by changed files would quietly turn a security gate
# into a changed-files gate. The weekly run is what keeps that property, for
# about four billed minutes a month.
#
# The push trigger stays rather than being deleted: Actions caches are scoped
# per branch and PR branches restore from the default branch's, so a default
# branch that never runs leaves every PR writing a cache no other branch can
# read.
on:
  # The two path lists are duplicated on purpose. A YAML anchor would say it
  # once, but GitHub Actions does not resolve anchors — the file would lint
  # clean and behave differently on the runner. Keep them in sync by hand.
  push:
    branches: [main]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend/requirements.txt"
      - ".github/workflows/security-scan.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend/requirements.txt"
      - ".github/workflows/security-scan.yml"
  schedule:
    # Mondays 06:00 UTC — the half a path filter cannot see.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # One job, not two. Both audits took about thirty seconds each and GitHub
  # bills every job rounded up to a full minute, so two jobs cost two minutes
  # for one minute of work. Splitting buys parallelism that nothing here needs.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The version the app is built and deployed with. Auditing a
          # different runtime than the one that ships audits the wrong tree.
          node-version: "22"
          # No `cache: npm`. Nothing is installed any more, so there is
          # nothing to restore — and a cache that is written and never read
          # still costs the time to save it.

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # No `npm ci` here. `npm audit` resolves the tree from
      # package-lock.json and asks the registry about it — it never reads
      # node_modules. Installing first added about 25 seconds to every run to
      # produce a directory nothing then looked at. Verified against this
      # repository's own pre-patch lockfile: with no node_modules at all, the
      # audit still reported the same 4 advisories (1 critical, 3 high) in
      # under a second.
      - name: Audit frontend for HIGH/CRITICAL CVEs
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

      # This condition has to be on the install too, not only on the audit
      # below. A failing step stops the job, so without it the install is
      # skipped when the frontend audit finds something and the backend audit
      # then fails with `pip-audit: command not found` — reporting a tooling
      # error where there was a real answer to give. Two separate jobs did not
      # need this; one job does, and that is the cost of merging them.
      - name: Install pip-audit
        if: ${{ !cancelled() }}
        run: pip install pip-audit==2.7.3

      # So a frontend advisory does not hide a backend one: both audits report
      # in the same run, and the run fails if either did.
      - name: Audit backend for known CVEs
        if: ${{ !cancelled() }}
        working-directory: backend
        run: pip-audit -r requirements.txt
