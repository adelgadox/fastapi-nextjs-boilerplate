name: Security Scan

# Audits the dependency trees for known CVEs.
#
# Two triggers, and they do different jobs. The path filter catches a bad
# dependency the moment it is added — that is the cheap half, and on its own it
# would be wrong: advisories are published against lockfiles nobody has
# touched, so filtering by changed files would quietly turn a security gate
# into a changed-files gate. The weekly run is what keeps that property, for
# about four billed minutes a month.
#
# The push trigger stays rather than being deleted: Actions caches are scoped
# per branch and PR branches restore from the default branch's, so a default
# branch that never runs leaves every PR writing a cache no other branch can
# read.
on:
  # The two path lists are duplicated on purpose. A YAML anchor would say it
  # once, but GitHub Actions does not resolve anchors — the file would lint
  # clean and behave differently on the runner. Keep them in sync by hand.
  push:
    branches: [main]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend/requirements.txt"
      - ".github/workflows/security-scan.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend/requirements.txt"
      - ".github/workflows/security-scan.yml"
  schedule:
    # Mondays 06:00 UTC — the half a path filter cannot see.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # One job, not two. Both audits took about thirty seconds each and GitHub
  # bills every job rounded up to a full minute, so two jobs cost two minutes
  # for one minute of work. Splitting buys parallelism that nothing here needs.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The version the app is built and deployed with. Auditing a
          # different runtime than the one that ships audits the wrong tree.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Audit frontend for HIGH/CRITICAL CVEs
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      # `always()` so a frontend advisory does not hide a backend one: both
      # audits report in the same run, and the run fails if either did.
      - name: Audit backend for known CVEs
        if: ${{ !cancelled() }}
        working-directory: backend
        run: pip-audit -r requirements.txt
