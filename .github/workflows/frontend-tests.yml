name: Frontend tests

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-tests.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-tests.yml"]

# Hygiene rather than a saving: this cancels a run only when a second push
# lands while the first is still going. It bounds a burst; it does not cut a
# steady bill.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run test suite
        run: npm test
      # `next build` is deliberately not repeated here: Vercel already runs it
      # on every push, and duplicating it in CI doubles the cost of each change
      # for no extra signal.
